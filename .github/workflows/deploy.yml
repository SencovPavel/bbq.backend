name: Deploy

on:
  push:
    branches: [main, dev]

jobs:
  deploy:
    name: Deploy → ${{ github.ref_name }}
    runs-on: self-hosted

    steps:
      - name: Deploy backend
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e

          if [ "$BRANCH" = "main" ]; then
            DEPLOY_DIR="/var/www/picnic/be-main"
            PM2_NAME="picnic-main"
          else
            DEPLOY_DIR="/var/www/picnic/be-dev"
            PM2_NAME="picnic-dev"
          fi

          echo "▶ Deploying backend '$BRANCH' → $DEPLOY_DIR"

          cd "$DEPLOY_DIR"
          git fetch origin
          git checkout "$BRANCH"
          git reset --hard "origin/$BRANCH"
          npm ci --prefer-offline

          pm2 describe "$PM2_NAME" > /dev/null 2>&1 \
            && pm2 reload "$PM2_NAME" --update-env \
            || PM2_NAME="$PM2_NAME" pm2 start ecosystem.config.js

          echo "✅ Done: $PM2_NAME restarted"
